cvm-version: 0.7.5
cpus: 2
memory: 8192

containers:
  - name: rootfs-attest
    image: python:3.11-alpine@sha256:8b5bfdb1fd2d78aa94e21c4d61be52487693f54be7f1021647751ff365795703
    devices:
      - /dev/sda
      - /dev/sdb
      - /dev/sdc
    volumes:
      - /proc:/host-proc:ro
    command:
      - python3
      - -c
      - |
        import hashlib, http.server, json
        def safe(fn):
            try: return fn()
            except Exception as e: return f'ERROR: {type(e).__name__}: {e}'
        def hash_dev(path, max_bytes=None, head_bytes=256):
            h = hashlib.sha256(); n = 0; head = b''
            with open(path, 'rb') as f:
                while True:
                    b = f.read(1<<20)
                    if not b: break
                    if not head: head = b[:head_bytes]
                    h.update(b); n += len(b)
                    if max_bytes and n >= max_bytes: break
            return {'sha256': h.hexdigest(), 'size': n, 'head_hex': head.hex()}
        class H(http.server.BaseHTTPRequestHandler):
            def do_GET(self):
                report = {
                    'cmdline': open('/host-proc/cmdline').read().strip(),
                    'sda': safe(lambda: hash_dev('/dev/sda')),
                    'sdb': safe(lambda: hash_dev('/dev/sdb')),
                    'sdc': safe(lambda: hash_dev('/dev/sdc')),
                }
                body = json.dumps(report, indent=2).encode()
                self.send_response(200); self.send_header('content-type', 'application/json')
                self.send_header('content-length', str(len(body))); self.end_headers()
                self.wfile.write(body)
            def log_message(self, *a, **k): pass
        http.server.HTTPServer(('0.0.0.0', 8080), H).serve_forever()

shim:
  upstream-port: 8080
  paths:
    - /*
